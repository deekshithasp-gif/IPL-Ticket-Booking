
<!DOCTYPE html>
<html>
<head>
    <title>IPL Ticket Booking Form</title>
</head>
<body>

    <h1>IPL Ticket Booking Form</h1>

    <form>

        <label>Name:</label><br>
        <input type="text" name="name"
        minlength="3" maxlength="30" required>
        <br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required>
        <br><br>

        <label>Phone Number:</label><br>
        <input type="tel" name="phone"
        pattern="[0-9]{10}" required>
        <br><br>

        <label>Select Match:</label><br>
        <select name="match" required>
            <option value="">Select Match</option>
            <option>RCB vs CSK</option>
            <option>MI vs KKR</option>
            <option>RCB vs MI</option>
        </select>
        <br><br>

        <label>Stand Category:</label><br>
        <select name="stand" required>
            <option value="">Select Stand</option>
            <option>General</option>
            <option>Premium</option>
            <option>VIP</option>
        </select>
        <br><br>

        <label>Number of Tickets:</label><br>
        <input type="number" name="tickets"
        min="1" max="10" required>
        <br><br>

        <label>Booking Preference:</label><br>
        <input type="radio" name="preference"
        value="Online" required> Online

        <input type="radio" name="preference"
        value="Counter"> Counter
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
